<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>{{POST_TITLE}}</title>
  <desc>{{ONE_LINE_DESCRIPTION}} — Prisma blog cover, 2026 brand: light paper surface, spectral prism wash, {{ACCENT_NAME}} accent.</desc>
  <defs>
    <!-- Spectral wash: 2-3 prism pools dissolving into the surface. Reposition
         per cover; bottom-edge pool is the house default. Keep type on calm areas. -->
    <radialGradient id="wash-cyan" cx="0.30" cy="1.05" r="0.75">
      <stop offset="0%" stop-color="#01d7e4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#01d7e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-yellow" cx="0.55" cy="1.10" r="0.70">
      <stop offset="0%" stop-color="#f3c306" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f3c306" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-red" cx="0.80" cy="1.05" r="0.70">
      <stop offset="0%" stop-color="#ff7682" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#ff7682" stop-opacity="0"/>
    </radialGradient>
    <!-- Grain: barely-there brand texture (multiply). -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1200" height="630" fill="#ffffff"/>
    <rect width="1200" height="630" fill="url(#wash-cyan)"/>
    <rect width="1200" height="630" fill="url(#wash-yellow)"/>
    <rect width="1200" height="630" fill="url(#wash-red)"/>
    <rect width="1200" height="630" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
  </g>

  <g id="kicker">
    <!-- Accent dot + sentence-case label. Dot = the cover's ONE accent
         ({{ACCENT_HEX}}: cyan #01d7e4 ORM/Prisma 8, yellow #f3c306 Postgres, red #f34a60 Compute). -->
    <circle cx="77" cy="99" r="4.5" fill="{{ACCENT_HEX}}"/>
    <text x="92" y="105" font-family="Inter" font-weight="600" font-size="17" fill="rgba(21,21,21,0.70)">{{KICKER_LABEL}}</text>
  </g>

  <g id="headline">
    <!-- Sora 500, sentence case, ink. 1-3 hand-wrapped lines; 68px, drop to 54px
         when a line passes ~30 chars. Emphasis = accent color (deep variant), not weight. -->
    <text font-family="Sora" font-weight="500" font-size="68" fill="#151515" letter-spacing="-1">
      <tspan x="72" y="198">{{TITLE_LINE_1}}</tspan>
      <tspan x="72" dy="76">{{TITLE_LINE_2}}</tspan>
    </text>
    <!-- Optional one-line subtitle (Inter 400, muted). Delete if unused. -->
    <text x="72" y="330" font-family="Inter" font-weight="400" font-size="26" fill="#646567">{{SUBTITLE}}</text>
  </g>

  <g id="module">
    <!-- Content module placeholder: one white card, hairline border, soft shadow.
         Replace with the module that carries the idea (see design-system.md).
         Keep ≥48px from every canvas edge. Code/terminal variants invert to ink
         (#151515 fill, #f9faf5 text). -->
    <g>
      <rect x="72" y="380" width="640" height="170" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
      <rect x="96" y="404" width="240" height="34" rx="10" fill="#eef4f3"/>
      <text x="112" y="427" font-family="Mona Sans Mono" font-weight="500" font-size="16" fill="#3a3b3c">{{MODULE_LABEL}}</text>
    </g>
  </g>

  <g id="brand">
    <!-- Sign-off: the word Prisma in Sora 600 ink, in whichever bottom corner is
         clear. (Alternative: the small full-color lockup, assets/logos/prisma-lockup-color.svg,
         pasted inline at ~110px wide.) Never prisma.io/blog; never icon + extra text. -->
    <text x="1043" y="573" font-family="Sora" font-weight="600" font-size="24" fill="#151515">Prisma</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05302B"/>
      <stop offset="0.55" stop-color="#04161A"/>
      <stop offset="1" stop-color="#03080D"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 -10) scale(640 470)">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 250) scale(520 480)">
      <stop offset="0" stop-color="#00E599" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#00E599"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#5EEAD4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glowTL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- roadmap / trajectory panel (house "log" motif) -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <rect x="742" y="150" width="376" height="330" rx="18" fill="#081F1D" fill-opacity="0.82" stroke="#2DD4BF" stroke-opacity="0.28" stroke-width="1"/>
    <!-- header -->
    <circle cx="772" cy="186" r="4" fill="#00E599"/>
    <text x="786" y="191" fill="#7CF2DD" font-size="13" font-weight="600" letter-spacing="3">ROADMAP</text>
    <text x="1090" y="191" fill="#6B7280" font-size="13" letter-spacing="1" text-anchor="end">// trajectory</text>

    <!-- timeline spine + nodes -->
    <line x1="780" y1="244" x2="780" y2="436" stroke="#1F4F49" stroke-width="1.5"/>

    <!-- rows -->
    <g font-size="17">
      <circle cx="780" cy="252" r="4.5" fill="#0E6F62" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="804" y="257" fill="#9CA3AF">2024 · Foundations</text>
      <text x="1092" y="258" fill="#5EEAD4" text-anchor="end" font-size="19">✓</text>

      <circle cx="780" cy="316" r="4.5" fill="#0E6F62" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="804" y="321" fill="#9CA3AF">2025 · Prisma Postgres</text>
      <text x="1092" y="322" fill="#5EEAD4" text-anchor="end" font-size="19">✓</text>

      <circle cx="780" cy="380" r="5.5" fill="#2DD4BF"/>
      <text x="804" y="385" fill="#E5E7EB">2026 · Compute &amp; AI</text>
      <text x="1090" y="385" fill="#2DD4BF" text-anchor="end">now ●</text>

      <!-- highlighted next row -->
      <rect x="760" y="412" width="342" height="40" rx="10" fill="#0E6F62" fill-opacity="0.30" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="780" cy="432" r="5.5" fill="#00E599"/>
      <text x="804" y="437" fill="#7CF2DD" font-weight="600">next · a bold new future</text>
      <text x="1090" y="437" fill="#00E599" text-anchor="end">→</text>
    </g>
  </g>

  <!-- eyebrow -->
  <g>
    <rect x="90" y="92" width="252" height="36" rx="18" fill="#0B2E2A" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="112" cy="110" r="4" fill="#00E599"/>
    <text x="128" y="115" fill="#7CF2DD" font-size="14" font-weight="600" letter-spacing="2.5">FIELD NOTES / 2026</text>
  </g>

  <!-- headline -->
  <g font-weight="800" letter-spacing="-2">
    <text x="86" y="248" fill="#F4FAF8" font-size="100">A bold</text>
    <text x="86" y="350" fill="url(#accent)" font-size="100">new future.</text>
  </g>

  <!-- subhead -->
  <text x="90" y="424" fill="#9CA3AF" font-size="25" font-weight="400" letter-spacing="0.2">Charting where Prisma goes next:</text>
  <text x="90" y="458" fill="#9CA3AF" font-size="25" font-weight="400" letter-spacing="0.2">data, compute, and AI, built in the open.</text>

  <!-- wordmark: bottom-left, no logo mark -->
  <text x="90" y="576" fill="#E5E7EB" font-size="28" font-weight="700" letter-spacing="-0.5">Prisma</text>
</svg>

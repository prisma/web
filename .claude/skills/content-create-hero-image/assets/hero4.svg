<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07221F"/>
      <stop offset="0.34" stop-color="#06141A"/>
      <stop offset="0.66" stop-color="#050E16"/>
      <stop offset="1" stop-color="#03080F"/>
    </linearGradient>
    <radialGradient id="glowTop" gradientUnits="userSpaceOnUse" cx="72" cy="0" r="370"
      gradientTransform="translate(72,0) scale(1,0.73) translate(-72,0)">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" gradientUnits="userSpaceOnUse" cx="24" cy="655" r="310"
      gradientTransform="translate(24,655) scale(1,0.84) translate(-24,-655)">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.10"/>
      <stop offset="0.56" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <!-- Panel -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1C20" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#060E14" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="panelShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="50" stdDeviation="42" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Data bars -->
    <linearGradient id="barGrey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CA3AF" stop-opacity="0"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="barActive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="activeGlow" x="-40%" y="-200%" width="180%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#5EEAD4" flood-opacity="0.7"/>
    </filter>
    <filter id="rowGlow" x="-20%" y="-120%" width="140%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#2DD4BF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTop)"/>
  <rect width="1200" height="630" fill="url(#glowBottom)"/>

  <!-- ===== Left text column ===== -->
  <g>
    <!-- Eyebrow -->
    <text x="72" y="128" fill="#2DD4BF" font-size="16" font-weight="700" letter-spacing="4.16">OPEN CHAT /</text>
    <text x="72" y="150" fill="#2DD4BF" font-size="16" font-weight="700" letter-spacing="4.16">DURABLE STREAMING</text>

    <!-- Headline -->
    <g font-size="50" font-weight="900" letter-spacing="-1.5">
      <text x="71" y="212" fill="#F9FAFB">Chat that</text>
      <text x="71" y="260" fill="#F9FAFB">never</text>
      <text x="71" y="308" fill="#5EEAD4">drops a</text>
      <text x="71" y="356" fill="#5EEAD4">token</text>
    </g>

    <!-- Sub-heading -->
    <g fill="#9CA3AF" font-size="20" font-weight="400">
      <text x="72" y="409">Durable log backed</text>
      <text x="72" y="434">streaming</text>
    </g>
  </g>

  <!-- ===== Durable log panel ===== -->
  <g>
    <!-- Card -->
    <rect x="478" y="60.5" width="664" height="507" rx="3" fill="url(#panel)" filter="url(#panelShadow)"/>
    <rect x="478.5" y="61" width="663" height="506" rx="2.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Header -->
    <text x="510" y="113" fill="#2DD4BF" font-size="19" font-weight="700" letter-spacing="2.28">DURABLE LOG</text>
    <text x="1110" y="111" text-anchor="end" fill="#6B7280" font-size="16" letter-spacing="0.32">head &#183; offset 412</text>

    <!-- Log rows -->
    <!-- 409 -->
    <g>
      <rect x="510" y="139.5" width="554" height="64" fill="#FFFFFF" fill-opacity="0.02"/>
      <text x="532" y="178.5" fill="#9CA3AF" font-size="19" font-weight="600">409</text>
      <text x="590" y="178.5" fill="#6B7280" font-size="19" font-weight="500">message.created</text>
      <rect x="812" y="165" width="230" height="13" rx="2" fill="url(#barGrey)"/>
    </g>
    <!-- 410 -->
    <g>
      <rect x="510" y="220.5" width="554" height="64" fill="#FFFFFF" fill-opacity="0.02"/>
      <text x="532" y="259.5" fill="#9CA3AF" font-size="19" font-weight="600">410</text>
      <text x="590" y="259.5" fill="#9CA3AF" font-size="19" font-weight="500">message.delta</text>
      <rect x="812" y="246" width="230" height="13" rx="2" fill="url(#barTeal)"/>
    </g>
    <!-- 411 -->
    <g>
      <rect x="510" y="301.5" width="554" height="64" fill="#FFFFFF" fill-opacity="0.02"/>
      <text x="532" y="340.5" fill="#9CA3AF" font-size="19" font-weight="600">411</text>
      <text x="590" y="340.5" fill="#9CA3AF" font-size="19" font-weight="500">message.delta</text>
      <rect x="812" y="327" width="230" height="13" rx="2" fill="url(#barTeal)"/>
    </g>
    <!-- 412 (active) -->
    <g filter="url(#rowGlow)">
      <rect x="510.5" y="383" width="553" height="63" rx="1" fill="#2DD4BF" fill-opacity="0.06"
        stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="1"/>
    </g>
    <text x="532" y="421.5" fill="#5EEAD4" font-size="19" font-weight="600">412</text>
    <text x="590" y="421.5" fill="#9CA3AF" font-size="19" font-weight="500">message.delta</text>
    <rect x="812" y="408" width="230" height="13" rx="2" fill="url(#barActive)" filter="url(#activeGlow)"/>

    <!-- Footer: SSE tail -->
    <text x="516" y="484" fill="#F9FAFB" font-size="17" font-weight="700">SSE tail</text>
    <g transform="translate(510,488)">
      <line x1="2" y1="17" x2="280" y2="17" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 22"/>
      <path d="M270 3 L312 17 L270 31" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="516" y="544" fill="#6B7280" font-size="14">resumes at 412</text>

    <!-- Footer: client chip -->
    <g>
      <rect x="1006" y="486" width="104" height="42" rx="6" fill="#2DD4BF" fill-opacity="0.05"/>
      <g transform="translate(1022,494)">
        <path d="M48 56h160a16 16 0 0 1 16 16v92a16 16 0 0 1-16 16H120l-44 36v-36H48a16 16 0 0 1-16-16V72a16 16 0 0 1 16-16Z"
          transform="scale(0.1016)" stroke="#5EEAD4" stroke-width="16" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="1056" y="514" fill="#F9FAFB" font-size="21" font-weight="700">client</text>
    </g>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="74" y="585" fill="#F9FAFB" font-size="19.2" font-weight="900" letter-spacing="-0.384">Prisma</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- background mirrored from hero (4): vertical teal-to-navy gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#042F2E"/>
      <stop offset="0.46" stop-color="#08101D"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <!-- teal radial glow: 860x580 at 28% top, alpha 0.12 fading by 56% -->
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(336 0) scale(1223 770)">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.12"/>
      <stop offset="0.56" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#00E599"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- code window -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <rect x="602" y="100" width="528" height="312" rx="16" fill="#081F1D" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="636" cy="143" r="4" fill="#00E599"/>
    <text x="650" y="148" fill="#7CF2DD" font-size="18">schema.prisma</text>
    <line x1="602" y1="166" x2="1130" y2="166" stroke="#2DD4BF" stroke-opacity="0.14" stroke-width="1"/>
    <g font-size="20">
      <text x="636" y="206"><tspan fill="#5EEAD4">model</tspan><tspan fill="#E5E7EB"> User </tspan><tspan fill="#6B7280">{</tspan></text>
      <text x="636" y="238"><tspan fill="#C9D1D9">  id        </tspan><tspan fill="#A5B4FC">String   </tspan><tspan fill="#5EEAD4">@id @default(</tspan><tspan fill="#7CF2DD">uuid()</tspan><tspan fill="#5EEAD4">)</tspan></text>
      <text x="636" y="270"><tspan fill="#C9D1D9">  email     </tspan><tspan fill="#A5B4FC">String   </tspan><tspan fill="#5EEAD4">@unique</tspan></text>
      <text x="636" y="302"><tspan fill="#C9D1D9">  name      </tspan><tspan fill="#A5B4FC">String?</tspan></text>
      <text x="636" y="334"><tspan fill="#C9D1D9">  posts     </tspan><tspan fill="#A5B4FC">Post[]</tspan></text>
      <text x="636" y="366"><tspan fill="#C9D1D9">  createdAt </tspan><tspan fill="#A5B4FC">DateTime </tspan><tspan fill="#5EEAD4">@default(</tspan><tspan fill="#7CF2DD">now()</tspan><tspan fill="#5EEAD4">)</tspan></text>
      <text x="636" y="398"><tspan fill="#6B7280">}</tspan></text>
    </g>
  </g>

  <!-- tree connector -->
  <g stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M866 412 V432 M728 432 H1004 M728 432 V452 M1004 432 V452"/>
  </g>

  <!-- chips -->
  <g>
    <rect x="602" y="452" width="252" height="74" rx="14" fill="#081F1D" fill-opacity="0.85" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="620" y="475" width="28" height="28" rx="7" fill="#0E6F62"/>
    <text x="664" y="484" fill="#E5E7EB" font-size="19" font-weight="700">migration.sql</text>
    <text x="664" y="506" fill="#9CA3AF" font-size="13" letter-spacing="0.3">generated</text>
    <rect x="878" y="452" width="252" height="74" rx="14" fill="#081F1D" fill-opacity="0.85" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="896" y="475" width="28" height="28" rx="7" fill="#0E6F62"/>
    <text x="940" y="484" fill="#E5E7EB" font-size="19" font-weight="700">database</text>
    <text x="940" y="506" fill="#7CF2DD" font-size="13" letter-spacing="0.3">in sync</text>
  </g>

  <!-- eyebrow -->
  <rect x="80" y="125" width="28" height="2" rx="1" fill="#2DD4BF"/>
  <text x="120" y="132" fill="#5EEAD4" font-size="14" font-weight="600" letter-spacing="2.5">PRISMA NEXT MIGRATIONS</text>

  <!-- headline -->
  <g font-weight="800" letter-spacing="-1.5">
    <text x="78" y="222" fill="#F4FAF8" font-size="64">Schema to</text>
    <text x="78" y="290" fill="url(#accent)" font-size="64">migration</text>
    <text x="78" y="358" fill="#F4FAF8" font-size="64">in one step</text>
  </g>

  <!-- wordmark: bottom-left, no logo mark -->
  <text x="80" y="566" fill="#E5E7EB" font-size="28" font-weight="700" letter-spacing="-0.5">Prisma</text>
</svg>

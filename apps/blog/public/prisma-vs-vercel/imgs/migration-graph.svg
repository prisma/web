<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="The migration graph after the merge. State A is production with id and email. Alice's migration adds phone to reach state B; Bob's migration adds avatarUrl to reach state C. Two merge migrations, one from B and one from C, both reach the merged state D with id, email, phone, and avatarUrl. Each arrow is one migration, recorded as the state it starts from and the state it ends at.">
  <rect width="960" height="400" fill="#f9faf5"/>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    .cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1px;fill:#646567}
    .cap-accent{fill:#007f8d}
    .ttl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:1.2px;fill:#151515}
    .name{font-size:15px;fill:#151515}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#3a3b3c}
    .sub{font-size:13px;fill:#646567}
    .box{fill:#ffffff;stroke:#c9c9c7;stroke-width:1.5}
    .box-dash{fill:#ffffff;stroke:#b5b5b3;stroke-width:1.5;stroke-dasharray:6 5}
    .wrap{fill:#eeeeec;stroke:#a5a5a6;stroke-width:1.5}
    .wrap-dash{fill:none;stroke:#a5a5a6;stroke-width:1.5;stroke-dasharray:7 6}
    .wrap-accent{fill:#eefdff;stroke:#00bbcb;stroke-width:1.5}
    .box-accent{fill:#ffffff;stroke:#00bbcb;stroke-width:1.5;stroke-dasharray:6 5}
    .edge{fill:none;stroke:#8a8a8c;stroke-width:1.5;stroke-dasharray:5 5}
    .edge-solid{fill:none;stroke:#8a8a8c;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8a8c" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="box" x="60" y="168" width="200" height="64" rx="6"/><text class="cap" x="160.0" y="194" text-anchor="middle">STATE A · PRODUCTION</text><text class="mono" x="160.0" y="216" text-anchor="middle">id, email</text>
  <rect class="box" x="380" y="60" width="200" height="64" rx="6"/><text class="cap" x="480.0" y="86" text-anchor="middle">STATE B · ALICE</text><text class="mono" x="480.0" y="108" text-anchor="middle">+ phone</text>
  <rect class="box" x="380" y="276" width="200" height="64" rx="6"/><text class="cap" x="480.0" y="302" text-anchor="middle">STATE C · BOB</text><text class="mono" x="480.0" y="324" text-anchor="middle">+ avatarUrl</text>
  <rect class="wrap-accent" x="680" y="168" width="250" height="64" rx="6"/><text class="cap cap-accent" x="805.0" y="194" text-anchor="middle">STATE D · MERGED</text><text class="mono" x="805.0" y="216" text-anchor="middle">id, email, phone, avatarUrl</text>
  <path class="edge-solid" d="M260 200 H320 V92 H372" marker-end="url(#ah)"/>
  <text class="cap" x="306" y="130" text-anchor="middle" transform="rotate(-90 306 130)">alice_add_phone</text>
  <path class="edge-solid" d="M260 200 H320 V308 H372" marker-end="url(#ah)"/>
  <text class="cap" x="306" y="270" text-anchor="middle" transform="rotate(-90 306 270)">bob_add_avatar</text>
  <path class="edge-solid" d="M580 92 H640 V200 H672" marker-end="url(#ah)"/>
  <text class="cap" x="626" y="130" text-anchor="middle" transform="rotate(-90 626 130)">merge_alice</text>
  <path class="edge-solid" d="M580 308 H640 V200 H672" marker-end="url(#ah)"/>
  <text class="cap" x="626" y="270" text-anchor="middle" transform="rotate(-90 626 270)">merge_bob</text>
  <text class="sub" x="480" y="380" text-anchor="middle">Each arrow is one migration, recorded as the state it starts from and the state it ends at.</text>
</svg>

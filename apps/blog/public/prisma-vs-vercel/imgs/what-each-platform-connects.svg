<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="What each platform connects for you. On Prisma, the data contract, the service contracts, and the root module in one repository are checked by TypeScript and deployed to Prisma Compute and Prisma Postgres. On Vercel, the framework code and its configuration are built and served through the delivery network, with a database connected through a Marketplace integration.">
  <rect width="960" height="540" fill="#f9faf5"/>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    .col{fill:#151515;font-size:22px;font-weight:600}
    .title{fill:#151515;font-size:17px;font-weight:600}
    .sub{fill:#3a3b3c;font-size:15px}
    .note{fill:#646567;font-size:14px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3a3b3c;font-size:14px}
    .box{fill:#ffffff;stroke:rgba(0,0,0,0.12);stroke-width:1.5}
    .repo{fill:#ffffff;stroke:rgba(0,0,0,0.12);stroke-width:1.5;stroke-dasharray:6 5}
    .edge{fill:none;stroke:#a5a5a6;stroke-width:2}
    .edge-accent{fill:none;stroke:#00bbcb;stroke-width:2}
    .label{fill:#646567;font-size:14px;font-weight:600;paint-order:stroke;stroke:#f9faf5;stroke-width:5;stroke-linejoin:round}
    .label-accent{fill:#007f8d}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5a5a6"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00bbcb"/>
    </marker>
  </defs>

  <!-- column headings -->
  <circle cx="48" cy="44" r="5.5" fill="#01d7e4"/>
  <text class="col" x="62" y="50">Prisma</text>
  <circle cx="528" cy="44" r="5.5" fill="#151515"/>
  <text class="col" x="542" y="50">Vercel</text>
  <line x1="480" y1="30" x2="480" y2="510" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>

  <!-- Prisma: repository -->
  <rect class="repo" x="40" y="76" width="400" height="176" rx="16"/>
  <text class="title" x="60" y="104">One repository, checked by TypeScript</text>
  <rect class="box" x="60" y="120" width="360" height="34" rx="9"/>
  <text class="mono" x="74" y="142">contract.prisma</text>
  <text class="note" x="406" y="142" text-anchor="end">data contract</text>
  <rect class="box" x="60" y="162" width="360" height="34" rx="9"/>
  <text class="mono" x="74" y="184">catalog/contract.ts</text>
  <text class="note" x="406" y="184" text-anchor="end">service contract</text>
  <rect class="box" x="60" y="204" width="360" height="34" rx="9"/>
  <text class="mono" x="74" y="226">module.ts</text>
  <text class="note" x="406" y="226" text-anchor="end">root module</text>

  <!-- Prisma: deploy edges -->
  <path class="edge-accent" d="M140 252 V330" marker-end="url(#arrow-accent)"/>
  <path class="edge-accent" d="M340 252 V330" marker-end="url(#arrow-accent)"/>
  <text class="label label-accent" x="240" y="296" text-anchor="middle">prisma deploy</text>
  <text class="note" x="240" y="314" text-anchor="middle">one command provisions and wires both</text>

  <!-- Prisma: targets -->
  <rect class="box" x="40" y="334" width="196" height="118" rx="14" stroke="#00bbcb"/>
  <text class="title" x="138" y="366" text-anchor="middle">Prisma Compute</text>
  <text class="sub" x="138" y="390" text-anchor="middle">storefront · catalog · orders</text>
  <text class="note" x="138" y="412" text-anchor="middle">TypeScript services on Bun</text>
  <text class="note" x="138" y="430" text-anchor="middle">isolated per Git branch</text>

  <rect class="box" x="244" y="334" width="196" height="118" rx="14" stroke="#00bbcb"/>
  <text class="title" x="342" y="366" text-anchor="middle">Prisma Postgres</text>
  <text class="sub" x="342" y="390" text-anchor="middle">a database per service</text>
  <text class="note" x="342" y="412" text-anchor="middle">typed by the data contract</text>
  <text class="note" x="342" y="430" text-anchor="middle">migrations from the graph</text>

  <path class="edge-accent" d="M236 393 H244"/>
  <text class="note" x="240" y="478" text-anchor="middle">Authenticated service-to-service calls are set up for you.</text>

  <!-- Vercel: repository -->
  <rect class="repo" x="520" y="76" width="400" height="176" rx="16"/>
  <text class="title" x="540" y="104">One repository, built by the framework</text>
  <rect class="box" x="540" y="120" width="360" height="34" rx="9"/>
  <text class="mono" x="554" y="142">app/</text>
  <text class="note" x="886" y="142" text-anchor="end">Next.js app</text>
  <rect class="box" x="540" y="162" width="360" height="34" rx="9"/>
  <text class="mono" x="554" y="184">vercel.json</text>
  <text class="note" x="886" y="184" text-anchor="end">services, routing, bindings</text>
  <rect class="box" x="540" y="204" width="360" height="34" rx="9"/>
  <text class="mono" x="554" y="226">lib/db.ts</text>
  <text class="note" x="886" y="226" text-anchor="end">your ORM or client</text>

  <!-- Vercel: deploy edges -->
  <path class="edge" d="M620 252 V330" marker-end="url(#arrow)"/>
  <path class="edge" d="M820 252 V330" marker-end="url(#arrow)"/>
  <text class="label" x="720" y="296" text-anchor="middle">git push</text>
  <text class="note" x="720" y="314" text-anchor="middle">build, then a preview or production URL</text>

  <!-- Vercel: targets -->
  <rect class="box" x="520" y="334" width="196" height="118" rx="14"/>
  <text class="title" x="618" y="366" text-anchor="middle">Vercel Functions</text>
  <text class="sub" x="618" y="390" text-anchor="middle">on the delivery network</text>
  <text class="note" x="618" y="412" text-anchor="middle">caching and images</text>
  <text class="note" x="618" y="430" text-anchor="middle">a preview URL per Git branch</text>

  <rect class="box" x="724" y="334" width="196" height="118" rx="14"/>
  <text class="title" x="822" y="366" text-anchor="middle">Marketplace database</text>
  <text class="sub" x="822" y="390" text-anchor="middle">Prisma Postgres, Neon</text>
  <text class="note" x="822" y="412" text-anchor="middle">connection string injected</text>
  <text class="note" x="822" y="430" text-anchor="middle">preview isolation per provider</text>

  <path class="edge" d="M716 393 H724"/>
  <text class="note" x="720" y="478" text-anchor="middle">Bindings inject a URL; you add shared types if you want them checked.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Every Git branch is its own environment. The main branch runs the storefront and catalog services against the production database with id and email. The alice/phone branch runs its own copies against its own database with a phone column added. The bob/avatar branch does the same with an avatarUrl column added.">
  <rect width="960" height="280" fill="#f9faf5"/>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    .cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1px;fill:#646567}
    .cap-accent{fill:#007f8d}
    .ttl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:1.2px;fill:#151515}
    .name{font-size:15px;fill:#151515}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#3a3b3c}
    .sub{font-size:13px;fill:#646567}
    .box{fill:#ffffff;stroke:#c9c9c7;stroke-width:1.5}
    .box-dash{fill:#ffffff;stroke:#b5b5b3;stroke-width:1.5;stroke-dasharray:6 5}
    .wrap{fill:#eeeeec;stroke:#a5a5a6;stroke-width:1.5}
    .wrap-dash{fill:none;stroke:#a5a5a6;stroke-width:1.5;stroke-dasharray:7 6}
    .wrap-accent{fill:#eefdff;stroke:#00bbcb;stroke-width:1.5}
    .box-accent{fill:#ffffff;stroke:#00bbcb;stroke-width:1.5;stroke-dasharray:6 5}
    .edge{fill:none;stroke:#8a8a8c;stroke-width:1.5;stroke-dasharray:5 5}
    .edge-solid{fill:none;stroke:#8a8a8c;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8a8c" stroke-width="1.5"/>
    </marker>
  </defs>

  <text class="cap" x="180" y="70" text-anchor="middle">PRODUCTION</text>
  <rect class="wrap-dash" x="40" y="80" width="280" height="160" rx="6"/>
  <text class="ttl" x="60" y="106">main</text>
  <rect class="box" x="60" y="122" width="240" height="34" rx="4"/>
  <text class="name" x="180" y="144" text-anchor="middle">storefront · catalog</text>
  <rect class="box" x="60" y="170" width="240" height="50" rx="4"/>
  <text class="name" x="180" y="190" text-anchor="middle">database</text>
  <text class="mono" x="180" y="209" text-anchor="middle">id, email</text>
  <text class="cap cap-accent" x="480" y="70" text-anchor="middle">PREVIEW BRANCH</text>
  <rect class="wrap-accent" x="340" y="80" width="280" height="160" rx="6"/>
  <text class="ttl" x="360" y="106">alice/phone</text>
  <rect class="box" x="360" y="122" width="240" height="34" rx="4"/>
  <text class="name" x="480" y="144" text-anchor="middle">storefront · catalog</text>
  <rect class="box" x="360" y="170" width="240" height="50" rx="4"/>
  <text class="name" x="480" y="190" text-anchor="middle">database</text>
  <text class="mono" x="480" y="209" text-anchor="middle">id, email, phone</text>
  <text class="cap cap-accent" x="780" y="70" text-anchor="middle">PREVIEW BRANCH</text>
  <rect class="wrap-accent" x="640" y="80" width="280" height="160" rx="6"/>
  <text class="ttl" x="660" y="106">bob/avatar</text>
  <rect class="box" x="660" y="122" width="240" height="34" rx="4"/>
  <text class="name" x="780" y="144" text-anchor="middle">storefront · catalog</text>
  <rect class="box" x="660" y="170" width="240" height="50" rx="4"/>
  <text class="name" x="780" y="190" text-anchor="middle">database</text>
  <text class="mono" x="780" y="209" text-anchor="middle">id, email, avatarUrl</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A67D8"/>
      <stop offset="1" stop-color="#16A394"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#16A394" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#16A394" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- co-located compute + data motif: stacked nodes -->
  <g transform="translate(800 150)" opacity="0.92">
    <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.6">
      <path d="M0 120 H300 M0 220 H300 M0 320 H300"/>
      <path d="M0 120 V320 M150 120 V320 M300 120 V320"/>
    </g>
    <g fill="url(#accent)">
      <circle cx="0" cy="120" r="9"/><circle cx="150" cy="120" r="9"/><circle cx="300" cy="120" r="9"/>
      <circle cx="0" cy="220" r="9"/><circle cx="150" cy="220" r="9"/><circle cx="300" cy="220" r="9"/>
      <circle cx="0" cy="320" r="9"/><circle cx="150" cy="320" r="9"/><circle cx="300" cy="320" r="9"/>
    </g>
  </g>

  <!-- text -->
  <text x="90" y="250" fill="#16A394" font-size="26" font-weight="600" letter-spacing="3">FIELD GUIDE · 2026</text>
  <text x="86" y="330" fill="#FFFFFF" font-size="68" font-weight="700">App Hosting &amp; Compute</text>
  <text x="86" y="408" fill="#FFFFFF" font-size="68" font-weight="700">Platforms for AI Agents</text>
  <text x="90" y="470" fill="#94A3B8" font-size="28" font-weight="400">Who shipped what, and how close they get to one coherent stack.</text>

  <rect x="90" y="520" width="64" height="6" rx="3" fill="url(#accent)"/>
</svg>

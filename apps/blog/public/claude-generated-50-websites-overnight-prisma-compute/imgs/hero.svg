<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Generated 50 Websites Overnight. Prisma Compute Helped Ship Them.</title>
  <desc id="desc">A Prisma Compute customer-story cover showing Claude, prisma app deploy, and live URLs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C3B35"/>
      <stop offset="0.45" stop-color="#071720"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.92">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#0F766E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="panelShadow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="tealGlow" x="-50%" y="-70%" width="200%" height="240%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#2DD4BF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <path d="M72 84H104" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="90" fill="#5EEAD4" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2.4">PRISMA COMPUTE CUSTOMER STORY</text>

  <text x="70" y="198" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="850" letter-spacing="-2">50 websites</text>
  <text x="70" y="284" fill="#5EEAD4" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="850" letter-spacing="-2">overnight</text>
  <text x="74" y="342" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="500">Claude generated them. Prisma Compute helped ship them.</text>

  <g filter="url(#panelShadow)">
    <rect x="122" y="418" width="210" height="112" rx="22" fill="#08111E" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="152" y="463" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Claude</text>
    <rect x="152" y="486" width="126" height="12" rx="6" fill="#5EEAD4"/>
    <rect x="152" y="511" width="150" height="12" rx="6" fill="#64748B"/>
  </g>

  <path d="M363 474H454" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  <path d="M436 452L458 474L436 496" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#tealGlow)">
    <rect x="488" y="398" width="270" height="152" rx="26" fill="#06101B" stroke="#5EEAD4" stroke-opacity="0.9" stroke-width="2"/>
    <rect x="524" y="432" width="198" height="22" rx="11" fill="#10B981"/>
    <text x="545" y="449" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">prisma app deploy</text>
    <rect x="524" y="481" width="166" height="15" rx="7.5" fill="#2DD4BF" fill-opacity="0.7"/>
    <rect x="524" y="515" width="210" height="15" rx="7.5" fill="#94A3B8"/>
  </g>

  <path d="M790 474H881" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  <path d="M863 452L885 474L863 496" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#panelShadow)">
    <rect x="916" y="418" width="214" height="112" rx="22" fill="#08111E" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="966" cy="474" r="26" fill="#10B981"/>
    <path d="M954 475L964 485L983 461" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1010" y="465" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">Live</text>
    <text x="1010" y="497" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">URLs</text>
  </g>

  <g opacity="0.9">
    <rect x="818" y="142" width="122" height="86" rx="14" fill="#08111E" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <rect x="838" y="163" width="76" height="10" rx="5" fill="#5EEAD4"/>
    <rect x="838" y="188" width="82" height="10" rx="5" fill="#64748B"/>
    <rect x="838" y="211" width="56" height="10" rx="5" fill="#334155"/>
  </g>
  <g opacity="0.9">
    <rect x="970" y="192" width="122" height="86" rx="14" fill="#08111E" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <rect x="990" y="213" width="76" height="10" rx="5" fill="#5EEAD4"/>
    <rect x="990" y="238" width="82" height="10" rx="5" fill="#64748B"/>
    <rect x="990" y="261" width="56" height="10" rx="5" fill="#334155"/>
  </g>
  <g opacity="0.9">
    <rect x="858" y="272" width="122" height="86" rx="14" fill="#08111E" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <rect x="878" y="293" width="76" height="10" rx="5" fill="#5EEAD4"/>
    <rect x="878" y="318" width="82" height="10" rx="5" fill="#64748B"/>
    <rect x="878" y="341" width="56" height="10" rx="5" fill="#334155"/>
  </g>

  <text x="1128" y="584" text-anchor="end" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="850">Prisma</text>
</svg>

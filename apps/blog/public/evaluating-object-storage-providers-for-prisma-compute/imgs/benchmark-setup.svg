<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc">
  <title id="title">How the object storage benchmark was set up</title>
  <desc id="desc">The same load-test app ran in six Prisma Compute regions: Frankfurt, Paris, N. Virginia, N. California, Singapore, and Tokyo. In each region it ran accelerated-fs with a 100 MiB local cache and the same workload — 10 KiB files up to 50 MiB, 500 MiB, and 5 GiB, then 1000 random reads and 1000 random writes, serial and interleaved — against two object stores: Tigris, one global bucket shared by all regions, and Cloudflare R2, a separate bucket placed near each region.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1117" />
      <stop offset="0.56" stop-color="#101a22" />
      <stop offset="1" stop-color="#0f151b" />
    </linearGradient>
    <linearGradient id="tigris" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3dd6c6" />
      <stop offset="1" stop-color="#8be9df" />
    </linearGradient>
    <linearGradient id="r2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff9f6e" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.30" />
    </filter>
    <marker id="aNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a5a6c" />
    </marker>
    <marker id="aTigris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3dd6c6" />
    </marker>
    <marker id="aR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff9f6e" />
    </marker>
  </defs>

  <rect width="1160" height="640" rx="24" fill="url(#bg)" />
  <path d="M70 540 C300 470 470 520 640 430 S980 250 1110 320" fill="none" stroke="#1f3441" stroke-width="2" opacity="0.5" />
  <path d="M60 575 C320 500 520 545 700 440 S1010 235 1118 300" fill="none" stroke="#223948" stroke-width="1.5" opacity="0.4" />

  <text x="58" y="66" fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">How the benchmark was set up</text>
  <text x="58" y="104" fill="#9fb2c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">The same load-test app ran in all six Prisma Compute regions against two object stores.</text>

  <!-- Column A: regions -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="58" y="150" width="270" height="420" rx="18" fill="#101d27" stroke="#26404f" stroke-width="1" />
    <text x="80" y="196" fill="#9fb2c0" font-size="15" font-weight="700" letter-spacing="0.3">Six Prisma Compute regions</text>

    <g>
      <rect x="76" y="216" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="246" fill="#dfe9f0" font-size="16" font-weight="600">Frankfurt</text>
      <text x="300" y="246" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">EU</text>
    </g>
    <g>
      <rect x="76" y="276" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="306" fill="#dfe9f0" font-size="16" font-weight="600">Paris</text>
      <text x="300" y="306" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">EU</text>
    </g>
    <g>
      <rect x="76" y="336" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="366" fill="#dfe9f0" font-size="16" font-weight="600">N. Virginia</text>
      <text x="300" y="366" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">US</text>
    </g>
    <g>
      <rect x="76" y="396" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="426" fill="#dfe9f0" font-size="16" font-weight="600">N. California</text>
      <text x="300" y="426" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">US</text>
    </g>
    <g>
      <rect x="76" y="456" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="486" fill="#dfe9f0" font-size="16" font-weight="600">Singapore</text>
      <text x="300" y="486" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">APAC</text>
    </g>
    <g>
      <rect x="76" y="516" width="234" height="48" rx="10" fill="#15232e" stroke="#2b4757" stroke-width="1" />
      <text x="94" y="546" fill="#dfe9f0" font-size="16" font-weight="600">Tokyo</text>
      <text x="300" y="546" text-anchor="end" fill="#6f8a99" font-size="12" font-weight="600">APAC</text>
    </g>
  </g>

  <!-- Arrow: regions to per-region stack -->
  <text x="360" y="349" text-anchor="middle" fill="#7f97a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">&#215;6</text>
  <line x1="330" y1="360" x2="386" y2="360" stroke="#3a5a6c" stroke-width="2" marker-end="url(#aNeutral)" />

  <!-- Column B: what each region runs -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="392" y="180" width="356" height="360" rx="18" fill="#101d27" stroke="#26404f" stroke-width="1" />
    <text x="412" y="218" fill="#9fb2c0" font-size="15" font-weight="700">What each region runs</text>

    <g>
      <rect x="412" y="240" width="316" height="72" rx="12" fill="#16242f" stroke="#2c4654" stroke-width="1" />
      <text x="432" y="274" fill="#e7f1f8" font-size="17" font-weight="700">Load-test app</text>
      <text x="432" y="297" fill="#8ba0ae" font-size="13">Bun microVM on Prisma Compute</text>
    </g>
    <g>
      <rect x="412" y="324" width="316" height="72" rx="12" fill="#16242f" stroke="#2c4654" stroke-width="1" />
      <text x="432" y="358" fill="#e7f1f8" font-size="17" font-weight="700">accelerated-fs</text>
      <text x="432" y="381" fill="#8ba0ae" font-size="13">100 MiB local cache over a larger dataset</text>
    </g>
    <g>
      <rect x="412" y="408" width="316" height="120" rx="12" fill="#16242f" stroke="#2c4654" stroke-width="1" />
      <text x="432" y="442" fill="#e7f1f8" font-size="17" font-weight="700">Benchmark workload</text>
      <text x="432" y="467" fill="#8ba0ae" font-size="12.5">1000 random reads + 1000 random writes</text>
      <text x="432" y="488" fill="#8ba0ae" font-size="12.5">serial &amp; interleaved &#183; 10 KiB files</text>
      <text x="432" y="509" fill="#8ba0ae" font-size="12.5">repeated at 50 MiB / 500 MiB / 5 GiB</text>
    </g>
  </g>

  <!-- Arrows: workload to the two object stores -->
  <path d="M748 360 C772 360 776 256 790 255" fill="none" stroke="#3dd6c6" stroke-width="2.5" marker-end="url(#aTigris)" />
  <path d="M748 360 C772 360 776 445 790 445" fill="none" stroke="#ff9f6e" stroke-width="2.5" marker-end="url(#aR2)" />

  <!-- Column C: the two object stores -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#softShadow)">
    <!-- Tigris -->
    <rect x="792" y="180" width="310" height="150" rx="16" fill="#121f2a" stroke="#28414f" stroke-width="1" />
    <rect x="792" y="180" width="6" height="150" rx="3" fill="url(#tigris)" />
    <text x="814" y="212" fill="#6f8a99" font-size="12" font-weight="600" letter-spacing="0.8">NO EGRESS &#183; S3-COMPATIBLE</text>
    <text x="814" y="246" fill="#e7f1f8" font-size="22" font-weight="700">Tigris</text>
    <text x="814" y="276" fill="#cfe0dc" font-size="15" font-weight="600">One global bucket</text>
    <text x="814" y="300" fill="#8ba0ae" font-size="13">Shared by all six regions</text>
    <ellipse cx="1040" cy="236" rx="20" ry="6" fill="none" stroke="#6fe0d3" stroke-width="2" />
    <path d="M1020 236 L1027 270 A13 5 0 0 0 1053 270 L1060 236" fill="none" stroke="#6fe0d3" stroke-width="2" />
    <text x="1040" y="294" text-anchor="middle" fill="#6fe0d3" font-size="14" font-weight="700">&#215;1</text>

    <!-- Cloudflare R2 -->
    <rect x="792" y="360" width="310" height="170" rx="16" fill="#121f2a" stroke="#28414f" stroke-width="1" />
    <rect x="792" y="360" width="6" height="170" rx="3" fill="url(#r2)" />
    <text x="814" y="392" fill="#6f8a99" font-size="12" font-weight="600" letter-spacing="0.8">NO EGRESS &#183; S3-COMPATIBLE</text>
    <text x="814" y="426" fill="#e7f1f8" font-size="22" font-weight="700">Cloudflare R2</text>
    <text x="814" y="456" fill="#f0d9c6" font-size="15" font-weight="600">A bucket near each region</text>
    <text x="814" y="480" fill="#b59a86" font-size="13">Six regional buckets</text>
    <text x="814" y="502" fill="#8b7a6c" font-size="12">APAC &#183; EEUR &#183; WEUR &#183; ENAM &#183; WNAM</text>
    <g stroke="#ffb27a" stroke-width="1.8" fill="none">
      <ellipse cx="1016" cy="402" rx="10" ry="3.2" />
      <path d="M1006 402 L1009 420 A7 3 0 0 0 1023 420 L1026 402" />
      <ellipse cx="1038" cy="410" rx="10" ry="3.2" />
      <path d="M1028 410 L1031 428 A7 3 0 0 0 1045 428 L1048 410" />
      <ellipse cx="1060" cy="418" rx="10" ry="3.2" />
      <path d="M1050 418 L1053 436 A7 3 0 0 0 1067 436 L1070 418" />
    </g>
    <text x="1082" y="426" text-anchor="middle" fill="#ffb27a" font-size="16" font-weight="700">&#215;6</text>
  </g>

  <text x="58" y="608" fill="#7f93a1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Each region issued the same 1000 reads and 1000 writes to both stores &#8212; only the object storage backend changed.</text>
</svg>

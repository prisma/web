<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
  <title id="title">Average mixed read/write time by object storage provider</title>
  <desc id="desc">Across six Prisma Compute regions, Tigris averaged 109.5, 183.3, and 265.8 seconds for 50 MiB, 500 MiB, and 5 GiB workloads. R2 averaged 578.7, 688.5, and 860.7 seconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1117" />
      <stop offset="0.56" stop-color="#101a22" />
      <stop offset="1" stop-color="#0f151b" />
    </linearGradient>
    <linearGradient id="tigris" x1="0" x2="1">
      <stop offset="0" stop-color="#3dd6c6" />
      <stop offset="1" stop-color="#8be9df" />
    </linearGradient>
    <linearGradient id="r2" x1="0" x2="1">
      <stop offset="0" stop-color="#ff9f6e" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect width="1160" height="680" rx="24" fill="url(#bg)" />
  <path d="M90 565 C265 460 352 520 505 422 S770 250 1080 318" fill="none" stroke="#1f3441" stroke-width="2" opacity="0.55" />
  <path d="M75 590 C255 490 405 540 555 430 S842 202 1102 282" fill="none" stroke="#223948" stroke-width="1.5" opacity="0.45" />

  <text x="58" y="64" fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Average mixed read/write phase</text>
  <text x="58" y="102" fill="#9fb2c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">1000 random reads and 1000 random writes, serial and interleaved, averaged across six Prisma Compute regions</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#b5c6d2">
    <rect x="60" y="132" width="18" height="18" rx="4" fill="url(#tigris)" />
    <text x="88" y="146">Tigris global bucket</text>
    <rect x="260" y="132" width="18" height="18" rx="4" fill="url(#r2)" />
    <text x="288" y="146">Cloudflare R2 bucket near each region</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#748996">
    <line x1="260" y1="178" x2="260" y2="552" stroke="#28404f" stroke-width="1" />
    <line x1="513" y1="178" x2="513" y2="552" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="767" y1="178" x2="767" y2="552" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="1020" y1="178" x2="1020" y2="552" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <text x="260" y="580" text-anchor="middle">0s</text>
    <text x="513" y="580" text-anchor="middle">300s</text>
    <text x="767" y="580" text-anchor="middle">600s</text>
    <text x="1020" y="580" text-anchor="middle">900s</text>
  </g>

  <g filter="url(#softShadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
      <text x="58" y="232" fill="#e7f1f8" font-size="22" font-weight="700">50 MiB</text>
      <text x="58" y="256" fill="#8296a4" font-size="14">5,120 files</text>
      <rect x="260" y="208" width="92" height="30" rx="7" fill="url(#tigris)" />
      <rect x="260" y="250" width="489" height="30" rx="7" fill="url(#r2)" />
      <text x="370" y="229" fill="#dffdf8" font-size="15" font-weight="700">109.5s</text>
      <text x="767" y="271" fill="#fff1c7" font-size="15" font-weight="700">578.7s</text>
      <text x="905" y="271" fill="#ffd166" font-size="15" font-weight="700">5.3x slower</text>
    </g>
    <g>
      <text x="58" y="362" fill="#e7f1f8" font-size="22" font-weight="700">500 MiB</text>
      <text x="58" y="386" fill="#8296a4" font-size="14">51,200 files</text>
      <rect x="260" y="338" width="155" height="30" rx="7" fill="url(#tigris)" />
      <rect x="260" y="380" width="581" height="30" rx="7" fill="url(#r2)" />
      <text x="433" y="359" fill="#dffdf8" font-size="15" font-weight="700">183.3s</text>
      <text x="859" y="401" fill="#fff1c7" font-size="15" font-weight="700">688.5s</text>
      <text x="996" y="401" fill="#ffd166" font-size="15" font-weight="700">3.8x slower</text>
    </g>
    <g>
      <text x="58" y="492" fill="#e7f1f8" font-size="22" font-weight="700">5 GiB</text>
      <text x="58" y="516" fill="#8296a4" font-size="14">524,288 files</text>
      <rect x="260" y="468" width="224" height="30" rx="7" fill="url(#tigris)" />
      <rect x="260" y="510" width="727" height="30" rx="7" fill="url(#r2)" />
      <text x="502" y="489" fill="#dffdf8" font-size="15" font-weight="700">265.8s</text>
      <text x="1005" y="531" fill="#fff1c7" font-size="15" font-weight="700">860.7s</text>
      <text x="1005" y="557" fill="#ffd166" font-size="15" font-weight="700">3.2x slower</text>
    </g>
  </g>

  <text x="58" y="632" fill="#7f93a1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Lower is better. Timings are wall-clock seconds from the benchmark app running in Prisma Compute.</text>
</svg>

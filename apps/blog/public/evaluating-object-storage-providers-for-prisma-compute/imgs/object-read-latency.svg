<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">Per-operation object store read latency by backend</title>
  <desc id="desc">On the 50 MiB workload, the fastest reads and p95 reads were: S3 Express One Zone 5.3 ms to 9.9 ms; Tigris 9.8 ms to 131.1 ms; standard S3 21.1 ms to 61.9 ms; Cloudflare R2 43.8 ms to 170.6 ms. S3 and S3 Express were measured from AWS Lambda in the same region; Tigris and R2 were measured from Prisma Compute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1117" />
      <stop offset="0.56" stop-color="#101a22" />
      <stop offset="1" stop-color="#0f151b" />
    </linearGradient>
  </defs>

  <rect width="1160" height="470" rx="24" fill="url(#bg)" />
  <path d="M70 400 C300 330 470 380 640 300 S980 150 1110 210" fill="none" stroke="#1f3441" stroke-width="2" opacity="0.45" />

  <text x="58" y="64" fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Per-operation object read latency</text>
  <text x="58" y="100" fill="#9fb2c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Each bar spans the fastest read to the p95, on the 50 MiB workload.</text>
  <text x="58" y="124" fill="#7f93a1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Lower and tighter is better; the floor barely moves as the dataset grows.</text>

  <!-- gridlines -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#748996">
    <line x1="250" y1="150" x2="250" y2="410" stroke="#28404f" stroke-width="1" />
    <line x1="392" y1="150" x2="392" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="533" y1="150" x2="533" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="675" y1="150" x2="675" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="817" y1="150" x2="817" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="958" y1="150" x2="958" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="1100" y1="150" x2="1100" y2="410" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <text x="250" y="432" text-anchor="middle">0</text>
    <text x="392" y="432" text-anchor="middle">30</text>
    <text x="533" y="432" text-anchor="middle">60</text>
    <text x="675" y="432" text-anchor="middle">90</text>
    <text x="817" y="432" text-anchor="middle">120</text>
    <text x="958" y="432" text-anchor="middle">150</text>
    <text x="1100" y="432" text-anchor="middle">180 ms</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <!-- S3 Express One Zone -->
    <text x="232" y="198" text-anchor="end" fill="#e7f1f8" font-size="17" font-weight="700">S3 Express</text>
    <text x="232" y="216" text-anchor="end" fill="#7f97a4" font-size="12">AWS &#183; same region</text>
    <line x1="275" y1="200" x2="297" y2="200" stroke="#b794f6" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <circle cx="275" cy="200" r="8" fill="#b794f6" />
    <circle cx="297" cy="200" r="6" fill="#b794f6" />
    <text x="263" y="205" text-anchor="end" fill="#cdd9e2" font-size="14" font-weight="600">5.3</text>
    <text x="309" y="205" fill="#cdd9e2" font-size="14" font-weight="600">9.9 ms</text>

    <!-- Tigris -->
    <text x="232" y="253" text-anchor="end" fill="#e7f1f8" font-size="17" font-weight="700">Tigris</text>
    <text x="232" y="271" text-anchor="end" fill="#7f97a4" font-size="12">global bucket</text>
    <line x1="296" y1="255" x2="869" y2="255" stroke="#3dd6c6" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <circle cx="296" cy="255" r="8" fill="#3dd6c6" />
    <circle cx="869" cy="255" r="6" fill="#3dd6c6" />
    <text x="284" y="260" text-anchor="end" fill="#cdd9e2" font-size="14" font-weight="600">9.8</text>
    <text x="881" y="260" fill="#cdd9e2" font-size="14" font-weight="600">131 ms</text>

    <!-- standard S3 -->
    <text x="232" y="308" text-anchor="end" fill="#e7f1f8" font-size="17" font-weight="700">S3</text>
    <text x="232" y="326" text-anchor="end" fill="#7f97a4" font-size="12">AWS &#183; same region</text>
    <line x1="350" y1="310" x2="542" y2="310" stroke="#7aa2f7" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <circle cx="350" cy="310" r="8" fill="#7aa2f7" />
    <circle cx="542" cy="310" r="6" fill="#7aa2f7" />
    <text x="338" y="315" text-anchor="end" fill="#cdd9e2" font-size="14" font-weight="600">21</text>
    <text x="554" y="315" fill="#cdd9e2" font-size="14" font-weight="600">62 ms</text>

    <!-- Cloudflare R2 -->
    <text x="232" y="363" text-anchor="end" fill="#e7f1f8" font-size="17" font-weight="700">Cloudflare R2</text>
    <text x="232" y="381" text-anchor="end" fill="#7f97a4" font-size="12">regional bucket</text>
    <line x1="457" y1="365" x2="1056" y2="365" stroke="#ff9f6e" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <circle cx="457" cy="365" r="8" fill="#ff9f6e" />
    <circle cx="1056" cy="365" r="6" fill="#ff9f6e" />
    <text x="445" y="370" text-anchor="end" fill="#cdd9e2" font-size="14" font-weight="600">44</text>
    <text x="1068" y="370" fill="#cdd9e2" font-size="14" font-weight="600">171 ms</text>
  </g>

  <text x="58" y="458" fill="#7f93a1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">S3 and S3 Express from AWS Lambda in-region; Tigris and R2 from Prisma Compute. Baseline, not a head-to-head.</text>
</svg>

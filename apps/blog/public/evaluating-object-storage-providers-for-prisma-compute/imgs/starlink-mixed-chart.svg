<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">Object storage latency from a Starlink-connected flight</title>
  <desc id="desc">From an in-flight Starlink connection, the averaged mixed read/write phase was 248.5 seconds on Tigris and 618.5 seconds on R2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1117" />
      <stop offset="1" stop-color="#111c24" />
    </linearGradient>
    <linearGradient id="tigris" x1="0" x2="1">
      <stop offset="0" stop-color="#3dd6c6" />
      <stop offset="1" stop-color="#8be9df" />
    </linearGradient>
    <linearGradient id="r2" x1="0" x2="1">
      <stop offset="0" stop-color="#ff9f6e" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
  </defs>
  <rect width="1160" height="360" rx="24" fill="url(#bg)" />
  <path d="M88 275 C230 195 373 260 527 185 C672 114 824 96 1075 136" fill="none" stroke="#284d5c" stroke-width="2" stroke-dasharray="6 9" />
  <path d="M230 205 l28 -11 l-12 18 l32 11 l-24 7 l-21 -12 l-20 6 z" fill="#9fb2c0" opacity="0.75" />

  <text x="58" y="64" fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Same workload from 36,000 feet</text>
  <text x="58" y="100" fill="#9fb2c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">In-flight Starlink run, averaged over two benchmark passes</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#748996">
    <line x1="260" y1="132" x2="260" y2="267" stroke="#28404f" stroke-width="1" />
    <line x1="620" y1="132" x2="620" y2="267" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <line x1="980" y1="132" x2="980" y2="267" stroke="#223846" stroke-width="1" stroke-dasharray="5 8" />
    <text x="260" y="300" text-anchor="middle">0s</text>
    <text x="620" y="300" text-anchor="middle">300s</text>
    <text x="980" y="300" text-anchor="middle">600s</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="58" y="168" fill="#e7f1f8" font-size="22" font-weight="700">Tigris</text>
    <rect x="260" y="144" width="298" height="34" rx="8" fill="url(#tigris)" />
    <text x="578" y="167" fill="#dffdf8" font-size="16" font-weight="700">248.5s</text>

    <text x="58" y="235" fill="#e7f1f8" font-size="22" font-weight="700">R2</text>
    <rect x="260" y="211" width="742" height="34" rx="8" fill="url(#r2)" />
    <text x="1022" y="234" fill="#fff1c7" font-size="16" font-weight="700">618.5s</text>
    <text x="1022" y="257" fill="#ffd166" font-size="15" font-weight="700">2.5x slower</text>
  </g>

  <text x="58" y="330" fill="#7f93a1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Lower is better. Insert times were nearly equal in this run; the gap came from the serial mixed phase.</text>
</svg>

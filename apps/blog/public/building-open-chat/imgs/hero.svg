<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Open Chat — chat that never drops a token</title>
  <desc id="d">Tokens stream into a durable append-only log, built on Durable Streams, Prisma Streams, TanStack DB, and Prisma Compute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0b1c"/>
      <stop offset="0.55" stop-color="#16142e"/>
      <stop offset="1" stop-color="#0a0912"/>
    </linearGradient>
    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="360" y1="250" x2="840" y2="300">
      <stop offset="0" stop-color="#aca7f6"/>
      <stop offset="1" stop-color="#7b74e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#6f69dd" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6f69dd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="600" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="#b9b4f2">OPEN CHAT · oss.chat</text>

  <g text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-weight="800" letter-spacing="-1.5">
    <text x="600" y="202" font-size="76" fill="#f4f3fb">Chat that never</text>
    <text x="600" y="280" font-size="76" fill="url(#violet)">drops a token.</text>
  </g>

  <!-- incoming tokens (prompt + model deltas) -->
  <g filter="url(#soft)" opacity="0.85">
    <circle cx="150" cy="392" r="10" fill="#8b85e8"/>
    <circle cx="210" cy="372" r="8" fill="#e0a23a"/>
    <circle cx="258" cy="408" r="7" fill="#8b85e8"/>
  </g>
  <circle cx="150" cy="392" r="6" fill="#c5c1f6"/>
  <circle cx="210" cy="372" r="5" fill="#f1cd8a"/>
  <circle cx="258" cy="408" r="4.5" fill="#c5c1f6"/>

  <!-- durable append-only log -->
  <rect x="300" y="360" width="600" height="64" rx="16" fill="#181633" stroke="#6f69dd" stroke-opacity="0.5" stroke-width="1.5"/>
  <g>
    <rect x="318" y="378" width="28" height="28" rx="6" fill="#d99113" opacity="0.85"/>
    <rect x="358" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="398" y="378" width="28" height="28" rx="6" fill="#35a873"/>
    <rect x="438" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="478" y="378" width="28" height="28" rx="6" fill="#3aa676"/>
    <rect x="518" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="558" y="378" width="28" height="28" rx="6" fill="#35a873"/>
    <rect x="598" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="638" y="378" width="28" height="28" rx="6" fill="#3aa676"/>
    <rect x="678" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="718" y="378" width="28" height="28" rx="6" fill="#35a873"/>
    <rect x="758" y="378" width="28" height="28" rx="6" fill="#2e9e63"/>
    <rect x="798" y="378" width="28" height="28" rx="6" fill="#3aa676"/>
    <rect x="838" y="378" width="28" height="28" rx="6" fill="#54c98f" stroke="#bff0d6" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
  <text x="916" y="400" font-family="ui-sans-serif,system-ui,Arial,sans-serif" font-size="22" font-weight="700" fill="#54c98f">→</text>

  <text x="600" y="476" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="21" fill="#a8a6c4">every token is appended to a durable log <tspan fill="#54c98f" font-weight="600">before</tspan> it reaches the screen</text>

  <text x="600" y="556" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="0.4" fill="#8e8ab6">Durable Streams &#160;·&#160; Prisma Streams &#160;·&#160; TanStack DB &#160;·&#160; Prisma Compute</text>
</svg>

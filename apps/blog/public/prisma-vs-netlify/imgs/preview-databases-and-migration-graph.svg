<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Preview databases and the migration graph on Prisma. The main branch and two feature branches each own a separate database. Alice's branch adds a phone field and Bob's branch adds an avatarUrl field. After both merge, the migration graph records each migration as a link between two contract states and plans a path from each database's current state to the combined schema.">
  <rect width="960" height="560" fill="#f9faf5"/>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    .h{fill:#151515;font-size:20px;font-weight:600}
    .title{fill:#151515;font-size:16px;font-weight:600}
    .sub{fill:#3a3b3c;font-size:15px}
    .note{fill:#646567;font-size:14px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;fill:#3a3b3c}
    .box{fill:#ffffff;stroke:rgba(0,0,0,0.12);stroke-width:1.5}
    .db{fill:#ffffff;stroke:rgba(0,0,0,0.12);stroke-width:1.5}
    .edge{fill:none;stroke:#a5a5a6;stroke-width:2}
    .edge-accent{fill:none;stroke:#00bbcb;stroke-width:2.5}
    .state{fill:#ffffff;stroke:#00bbcb;stroke-width:2}
    .state-final{fill:#dcfdff;stroke:#007f8d;stroke-width:2}
    .label{fill:#646567;font-size:13.5px;font-weight:600;paint-order:stroke;stroke:#f9faf5;stroke-width:5;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5a5a6"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00bbcb"/>
    </marker>
  </defs>

  <!-- Section 1: branches own databases -->
  <circle cx="48" cy="44" r="5.5" fill="#01d7e4"/>
  <text class="h" x="62" y="50">Every Git branch owns its own database</text>

  <!-- main lane -->
  <rect class="box" x="40" y="76" width="270" height="120" rx="14"/>
  <text class="mono" x="60" y="102">main</text>
  <text class="note" x="290" y="102" text-anchor="end">production</text>
  <g transform="translate(60 116)">
    <rect class="db" width="230" height="60" rx="10"/>
    <text class="title" x="115" y="26" text-anchor="middle">production database</text>
    <text class="mono" x="115" y="46" text-anchor="middle">User { id, email }</text>
  </g>

  <!-- alice lane -->
  <rect class="box" x="345" y="76" width="270" height="120" rx="14"/>
  <text class="mono" x="365" y="102">alice/phone</text>
  <text class="note" x="595" y="102" text-anchor="end">preview branch</text>
  <g transform="translate(365 116)">
    <rect class="db" width="230" height="60" rx="10" stroke="#00bbcb"/>
    <text class="title" x="115" y="26" text-anchor="middle">alice's database</text>
    <text class="mono" x="115" y="46" text-anchor="middle">User { id, email, phone }</text>
  </g>

  <!-- bob lane -->
  <rect class="box" x="650" y="76" width="270" height="120" rx="14"/>
  <text class="mono" x="670" y="102">bob/avatar</text>
  <text class="note" x="900" y="102" text-anchor="end">preview branch</text>
  <g transform="translate(670 116)">
    <rect class="db" width="230" height="60" rx="10" stroke="#00bbcb"/>
    <text class="title" x="115" y="26" text-anchor="middle">bob's database</text>
    <text class="mono" x="115" y="46" text-anchor="middle">User { id, email, avatarUrl }</text>
  </g>

  <text class="note" x="480" y="222" text-anchor="middle">Each preview deploys its own services and database. Test rows never reach production.</text>

  <!-- Section 2: the migration graph -->
  <circle cx="48" cy="272" r="5.5" fill="#01d7e4"/>
  <text class="h" x="62" y="278">After the merge, the migration graph plans each path</text>

  <!-- graph nodes -->
  <g id="s0">
    <rect class="state" x="60" y="380" width="150" height="50" rx="12"/>
    <text class="title" x="135" y="401" text-anchor="middle">state A</text>
    <text class="mono" x="135" y="420" text-anchor="middle">id, email</text>
  </g>
  <g id="s1">
    <rect class="state" x="330" y="310" width="150" height="50" rx="12"/>
    <text class="title" x="405" y="331" text-anchor="middle">state B</text>
    <text class="mono" x="405" y="350" text-anchor="middle">+ phone</text>
  </g>
  <g id="s2">
    <rect class="state" x="330" y="450" width="150" height="50" rx="12"/>
    <text class="title" x="405" y="471" text-anchor="middle">state C</text>
    <text class="mono" x="405" y="490" text-anchor="middle">+ avatarUrl</text>
  </g>
  <g id="s3">
    <rect class="state-final" x="582" y="380" width="222" height="50" rx="12"/>
    <text class="title" x="693" y="400" text-anchor="middle">merged state D</text>
    <text class="mono" x="693" y="420" text-anchor="middle" style="font-size:12px">id, email, phone, avatarUrl</text>
  </g>

  <!-- graph edges: each migration links two contract states -->
  <path class="edge-accent" d="M210 395 C270 395 270 335 330 335" marker-end="url(#ac)"/>
  <path class="edge-accent" d="M210 415 C270 415 270 475 330 475" marker-end="url(#ac)"/>
  <path class="edge-accent" d="M480 335 C530 335 530 395 582 395" marker-end="url(#ac)"/>
  <path class="edge-accent" d="M480 475 C530 475 530 415 582 415" marker-end="url(#ac)"/>

  <text class="label" x="270" y="352" text-anchor="middle">alice's migration</text>
  <text class="label" x="270" y="468" text-anchor="middle">bob's migration</text>
  <text class="label" x="540" y="352" text-anchor="middle">planned: add avatarUrl</text>
  <text class="label" x="540" y="468" text-anchor="middle">planned: add phone</text>

  <!-- side note -->
  <rect class="box" x="816" y="330" width="104" height="150" rx="12"/>
  <text class="note" x="868" y="356" text-anchor="middle">production</text>
  <text class="note" x="868" y="374" text-anchor="middle">is at state A</text>
  <text class="note" x="868" y="402" text-anchor="middle">alice's db</text>
  <text class="note" x="868" y="420" text-anchor="middle">is at state B</text>
  <text class="note" x="868" y="448" text-anchor="middle">bob's db</text>
  <text class="note" x="868" y="466" text-anchor="middle">is at state C</text>

  <text class="note" x="480" y="536" text-anchor="middle">A migration is a link between two contract states, so every database reaches state D from wherever it is.</text>
</svg>

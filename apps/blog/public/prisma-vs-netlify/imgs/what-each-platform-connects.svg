<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="What each platform connects. On Prisma, the repository holds the data contract, the service contract, and the root module; prisma deploy provisions the storefront and catalog services on Prisma Compute and a Prisma Postgres database typed by the contract. On Netlify, the repository holds the site and its functions; a git push builds and publishes both, and Netlify Database connects a Postgres branch per preview through NETLIFY_DB_URL.">
  <rect width="960" height="560" fill="#f9faf5"/>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    .cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1px;fill:#646567}
    .cap-accent{fill:#007f8d}
    .ttl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:1.2px;fill:#151515}
    .name{font-size:15px;fill:#151515}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#3a3b3c}
    .sub{font-size:13px;fill:#646567}
    .box{fill:#ffffff;stroke:#c9c9c7;stroke-width:1.5}
    .box-dash{fill:#ffffff;stroke:#b5b5b3;stroke-width:1.5;stroke-dasharray:6 5}
    .wrap{fill:#eeeeec;stroke:#a5a5a6;stroke-width:1.5}
    .wrap-dash{fill:none;stroke:#a5a5a6;stroke-width:1.5;stroke-dasharray:7 6}
    .wrap-accent{fill:#eefdff;stroke:#00bbcb;stroke-width:1.5}
    .box-accent{fill:#ffffff;stroke:#00bbcb;stroke-width:1.5;stroke-dasharray:6 5}
    .edge{fill:none;stroke:#8a8a8c;stroke-width:1.5;stroke-dasharray:5 5}
    .edge-solid{fill:none;stroke:#8a8a8c;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8a8c" stroke-width="1.5"/>
    </marker>
  </defs>

  <text class="ttl" x="40" y="56">PRISMA</text>
  <rect class="wrap" x="40" y="70" width="220" height="176" rx="6"/>
  <text class="cap" x="60" y="96">YOUR REPOSITORY</text>
  <rect class="box-dash" x="60" y="110" width="180" height="34" rx="4"/>
  <text class="mono" x="150" y="132" text-anchor="middle">contract.prisma</text>
  <rect class="box-dash" x="60" y="154" width="180" height="34" rx="4"/>
  <text class="mono" x="150" y="176" text-anchor="middle">catalog/contract.ts</text>
  <rect class="box-dash" x="60" y="198" width="180" height="34" rx="4"/>
  <text class="mono" x="150" y="220" text-anchor="middle">module.ts</text>
  <path class="edge" d="M260 158.0 H372" marker-end="url(#ah)"/>
  <text class="cap" x="316" y="146.0" text-anchor="middle">prisma deploy</text>
  <text class="cap cap-accent" x="490" y="82.0" text-anchor="middle">PROVISIONED FROM module.ts</text>
  <rect class="wrap-accent" x="380" y="92.0" width="220" height="132" rx="6"/>
  <text class="ttl" x="490" y="118.0" text-anchor="middle">PRISMA COMPUTE</text>
  <rect class="box-accent" x="400" y="132.0" width="180" height="34" rx="4"/>
  <text class="name" x="490" y="154.0" text-anchor="middle">storefront</text>
  <rect class="box-accent" x="400" y="176.0" width="180" height="34" rx="4"/>
  <text class="name" x="490" y="198.0" text-anchor="middle">catalog</text>
  <path class="edge" d="M600 158.0 H712" marker-end="url(#ah)"/>
  <text class="cap" x="656" y="146.0" text-anchor="middle">postgres()</text>
  <text class="cap" x="820" y="104.0" text-anchor="middle">TYPED BY contract.prisma</text>
  <rect class="wrap-dash" x="720" y="114.0" width="200" height="88" rx="6"/>
  <text class="ttl" x="820" y="140.0" text-anchor="middle">PRISMA POSTGRES</text>
  <rect class="box" x="735" y="154.0" width="170" height="34" rx="4"/>
  <text class="name" x="820" y="176.0" text-anchor="middle">database</text>
  <text class="ttl" x="40" y="316">NETLIFY</text>
  <rect class="wrap" x="40" y="330" width="220" height="132" rx="6"/>
  <text class="cap" x="60" y="356">YOUR REPOSITORY</text>
  <rect class="box-dash" x="60" y="370" width="180" height="34" rx="4"/>
  <text class="mono" x="150" y="392" text-anchor="middle">src/</text>
  <rect class="box-dash" x="60" y="414" width="180" height="34" rx="4"/>
  <text class="mono" x="150" y="436" text-anchor="middle">netlify/functions/</text>
  <path class="edge" d="M260 396.0 H372" marker-end="url(#ah)"/>
  <text class="cap" x="316" y="384.0" text-anchor="middle">git push</text>
  <text class="cap" x="490" y="320.0" text-anchor="middle">BUILT AS A SITE</text>
  <rect class="wrap" x="380" y="330.0" width="220" height="132" rx="6"/>
  <text class="ttl" x="490" y="356.0" text-anchor="middle">NETLIFY</text>
  <rect class="box-dash" x="400" y="370.0" width="180" height="34" rx="4"/>
  <text class="name" x="490" y="392.0" text-anchor="middle">site</text>
  <rect class="box-dash" x="400" y="414.0" width="180" height="34" rx="4"/>
  <text class="name" x="490" y="436.0" text-anchor="middle">functions</text>
  <path class="edge" d="M600 396.0 H712" marker-end="url(#ah)"/>
  <text class="cap" x="656" y="384.0" text-anchor="middle">NETLIFY_DB_URL</text>
  <text class="cap" x="820" y="342.0" text-anchor="middle">A BRANCH PER PREVIEW</text>
  <rect class="wrap-dash" x="720" y="352.0" width="200" height="88" rx="6"/>
  <text class="ttl" x="820" y="378.0" text-anchor="middle">NETLIFY DATABASE</text>
  <rect class="box" x="735" y="392.0" width="170" height="34" rx="4"/>
  <text class="name" x="820" y="414.0" text-anchor="middle">Postgres on Neon</text>
</svg>

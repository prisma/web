<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <style>
    .ink, .accent { stroke-dasharray: 1; stroke-dashoffset: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .ink { animation: draw 2.2s 0.4s cubic-bezier(0.45, 0, 0.2, 1) both; }
      .late { animation-delay: 0.68s; }
      .accent { animation: draw 1.4s 1.25s cubic-bezier(0.45, 0, 0.2, 1) both; }
    }
    @keyframes draw {
      from { stroke-dashoffset: 1; opacity: 0.2; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <rect width="320" height="180" fill="#f3f3f3"/>

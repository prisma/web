  <path class="ink" pathLength="1" d="M126 72h96" stroke="#8d8d8d" stroke-width="1.5" stroke-linecap="round"/>
  <path class="ink late" pathLength="1" d="M126 86h72" stroke="#8d8d8d" stroke-width="1.5" stroke-linecap="round"/>

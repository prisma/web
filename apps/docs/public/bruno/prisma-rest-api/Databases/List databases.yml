info:
  name: List databases
  type: http
  seq: 1
  tags:
    - Databases

http:
  method: GET
  url: "{{baseUrl}}/v1/databases"
  params:
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Limit for pagination
    - name: projectId
      value: ""
      type: query
      description: Filter databases by project ID
      disabled: true
    - name: logicalId
      value: ""
      type: query
      description: Declared identity of the resource, unique within its branch. Set by the tool that declares the resource.
      disabled: true
    - name: branchId
      value: ""
      type: query
      disabled: true
    - name: branchGitName
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


info:
  name: Restore database (destructive)
  type: http
  seq: 6
  tags:
    - Databases

http:
  method: POST
  url: "{{baseUrl}}/v1/databases/:targetDatabaseId/restore"
  params:
    - name: targetDatabaseId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "source": {
          "type": "",
          "databaseId": "",
          "backupId": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


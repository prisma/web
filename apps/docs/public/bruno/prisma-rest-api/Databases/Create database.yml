info:
  name: Create database
  type: http
  seq: 2
  tags:
    - Databases

http:
  method: POST
  url: "{{baseUrl}}/v1/databases"
  body:
    type: json
    data: |-
      {
        "projectId": "",
        "region": "us-east-1",
        "name": "",
        "isDefault": false,
        "source": "",
        "branchId": "",
        "branchGitName": "",
        "logicalId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


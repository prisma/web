info:
  name: Update database
  type: http
  seq: 4
  tags:
    - Databases

http:
  method: PATCH
  url: "{{baseUrl}}/v1/databases/:databaseId"
  params:
    - name: databaseId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "branchId": "",
        "branchGitName": "",
        "logicalId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


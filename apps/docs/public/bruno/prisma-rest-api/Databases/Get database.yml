info:
  name: Get database
  type: http
  seq: 3
  tags:
    - Databases

http:
  method: GET
  url: "{{baseUrl}}/v1/databases/:databaseId"
  params:
    - name: databaseId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


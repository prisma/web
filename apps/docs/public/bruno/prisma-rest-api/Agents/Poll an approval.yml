info:
  name: Poll an approval
  type: http
  seq: 1
  tags:
    - Agents

http:
  method: GET
  url: "{{baseUrl}}/v1/agent-approvals/:approvalId"
  params:
    - name: approvalId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: The approval's current state
    request:
      url: "{{baseUrl}}/v1/agent-approvals/:approvalId"
      method: GET
      params:
        - name: approvalId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "status": "pending",
            "expiresAt": "",
            "windowExpiresAt": "",
            "decidedAt": "",
            "hint": ""
          }
  - name: 404 Response
    description: No such approval for this agent
    request:
      url: "{{baseUrl}}/v1/agent-approvals/:approvalId"
      method: GET
      params:
        - name: approvalId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Reports where an approval stands, so an agent holding an approval_required response can wait for the sponsor's decision and retry. Only the agent the approval belongs to can read it.

info:
  name: Get all regions
  type: http
  seq: 1
  tags:
    - Regions

http:
  method: GET
  url: "{{baseUrl}}/v1/regions"
  params:
    - name: product
      value: postgres
      type: query
      disabled: true
    - name: product
      value: accelerate
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returns all available regions.
    request:
      url: "{{baseUrl}}/v1/regions"
      method: GET
      params:
        - name: product
          value: postgres
          type: query
          disabled: true
        - name: product
          value: accelerate
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "type": "",
                "name": "",
                "product": "postgres",
                "status": "available"
              }
            ]
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/regions"
      method: GET
      params:
        - name: product
          value: postgres
          type: query
          disabled: true
        - name: product
          value: accelerate
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/regions"
      method: GET
      params:
        - name: product
          value: postgres
          type: query
          disabled: true
        - name: product
          value: accelerate
          type: query
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns all available regions across products. Optionally filter by product.

info:
  name: Get database usage metrics
  type: http
  seq: 1
  tags:
    - Database_Usage

http:
  method: GET
  url: "{{baseUrl}}/v1/databases/:databaseId/usage"
  params:
    - name: databaseId
      value: ""
      type: path
    - name: startDate
      value: ""
      type: query
      description: Start date for metrics query. Defaults to start of current month if not provided.
      disabled: true
    - name: endDate
      value: ""
      type: query
      description: End date for metrics query. Will be set to end of day if a future date is provided. Defaults to current date if not provided.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returned usage metrics for the given database.
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/usage"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: startDate
          value: ""
          type: query
          description: Start date for metrics query. Defaults to start of current month if not provided.
          disabled: true
        - name: endDate
          value: ""
          type: query
          description: End date for metrics query. Will be set to end of day if a future date is provided. Defaults to current date if not provided.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "period": {
              "start": "",
              "end": ""
            },
            "metrics": {
              "operations": {
                "used": 0,
                "unit": ""
              },
              "storage": {

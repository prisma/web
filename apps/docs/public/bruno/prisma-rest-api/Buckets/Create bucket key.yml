info:
  name: Create bucket key
  type: http
  seq: 7
  tags:
    - Buckets

http:
  method: POST
  url: "{{baseUrl}}/v1/buckets/:bucketId/keys"
  params:
    - name: bucketId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "role": "read"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


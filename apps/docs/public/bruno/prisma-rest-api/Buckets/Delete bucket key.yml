info:
  name: Delete bucket key
  type: http
  seq: 8
  tags:
    - Buckets

http:
  method: DELETE
  url: "{{baseUrl}}/v1/buckets/:bucketId/keys/:keyId"
  params:
    - name: bucketId
      value: ""
      type: path
    - name: keyId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: Deleted the bucket key successfully.
    request:
      url: "{{baseUrl}}/v1/buckets/:bucketId/keys/:keyId"
      method: DELETE
      params:
        - name: bucketId
          value: ""
          type: path
        - name: keyId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/buckets/:bucketId/keys/:keyId"
      method: DELETE
      params:
        - name: bucketId
          value: ""
          type: path
        - name: keyId
          value: ""
          type: path
    response:
      status: 400

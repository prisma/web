info:
  name: List buckets
  type: http
  seq: 1
  tags:
    - Buckets

http:
  method: GET
  url: "{{baseUrl}}/v1/buckets"
  params:
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Page size, 1-100
    - name: projectId
      value: ""
      type: query
      description: Filter buckets by project ID
      disabled: true
    - name: logicalId
      value: ""
      type: query
      description: Declared identity of the resource, unique within its branch. Set by the tool that declares the resource.
      disabled: true
    - name: branchId
      value: ""
      type: query
      disabled: true
    - name: branchGitName
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


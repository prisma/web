info:
  name: Update bucket
  type: http
  seq: 4
  tags:
    - Buckets

http:
  method: PATCH
  url: "{{baseUrl}}/v1/buckets/:bucketId"
  params:
    - name: bucketId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "displayName": "",
        "branchId": "",
        "branchGitName": "",
        "logicalId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


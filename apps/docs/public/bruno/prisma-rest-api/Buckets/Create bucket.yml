info:
  name: Create bucket
  type: http
  seq: 2
  tags:
    - Buckets

http:
  method: POST
  url: "{{baseUrl}}/v1/buckets"
  body:
    type: json
    data: |-
      {
        "projectId": "",
        "name": "",
        "branchId": "",
        "branchGitName": "",
        "logicalId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created a new bucket.
    request:
      url: "{{baseUrl}}/v1/buckets"
      method: POST
      body:
        type: json
        data: |-
          {
            "projectId": "",
            "name": "",
            "branchId": "",
            "branchGitName": "",
            "logicalId": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "type": "",
              "url": "",
              "name": "",
              "providerName": "",
              "status": "",
              "createdAt": "",
              "project": {
                "id": "",
                "url": "",
                "name": ""
              },
              "branchId": "",
              "logicalId": ""
            }
          }
  - name: 400 Response
    description: Invalid request parameters.
    request:
      url: "{{baseUrl}}/v1/buckets"
      method: POST
      body:
        type: json
        data: |-
          {
            "projectId": "",
            "name": "",
            "branchId": "",
            "branchGitName": "",
            "logicalId": ""
          }
    response:

info:
  name: List bucket keys
  type: http
  seq: 6
  tags:
    - Buckets

http:
  method: GET
  url: "{{baseUrl}}/v1/buckets/:bucketId/keys"
  params:
    - name: bucketId
      value: ""
      type: path
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Page size, 1-100
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


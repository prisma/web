info:
  name: Get bucket
  type: http
  seq: 3
  tags:
    - Buckets

http:
  method: GET
  url: "{{baseUrl}}/v1/buckets/:bucketId"
  params:
    - name: bucketId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returned the bucket with the given ID.
    request:
      url: "{{baseUrl}}/v1/buckets/:bucketId"
      method: GET
      params:
        - name: bucketId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "type": "",
              "url": "",
              "name": "",
              "providerName": "",
              "status": "",
              "createdAt": "",
              "project": {
                "id": "",
                "url": "",
                "name": ""
              },
              "branchId": "",
              "logicalId": ""
            }
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/buckets/:bucketId"
      method: GET
      params:
        - name: bucketId
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/buckets/:bucketId"
      method: GET
      params:
        - name: bucketId
          value: ""
          type: path
    response:
      status: 401

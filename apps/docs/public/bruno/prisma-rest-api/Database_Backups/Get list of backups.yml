info:
  name: Get list of backups
  type: http
  seq: 1
  tags:
    - Database_Backups

http:
  method: GET
  url: "{{baseUrl}}/v1/databases/:databaseId/backups"
  params:
    - name: databaseId
      value: ""
      type: path
    - name: limit
      value: "25"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returned backups for the given database.
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/backups"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: limit
          value: "25"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "backupType": "full",
                "createdAt": "",
                "size": 0,
                "status": "running",
                "type": ""
              }
            ],
            "meta": {
              "backupRetentionDays": 0
            },
            "pagination": {
              "hasMore": false,
              "limit": ""
            }
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/backups"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: limit
          value: "25"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/backups"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: limit
          value: "25"
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }
  - name: 404 Response
    description: Database with the given ID was not found.
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/backups"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: limit
          value: "25"
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }
  - name: 422 Response
    description: Remote database backups are not supported
    request:
      url: "{{baseUrl}}/v1/databases/:databaseId/backups"
      method: GET
      params:
        - name: databaseId
          value: ""
          type: path
        - name: limit
          value: "25"
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns backups for the specified database.

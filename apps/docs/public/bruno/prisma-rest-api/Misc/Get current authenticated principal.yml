info:
  name: Get current authenticated principal
  type: http
  seq: 1
  tags:
    - Misc

http:
  method: GET
  url: "{{baseUrl}}/v1/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Current authenticated principal retrieved.
    request:
      url: "{{baseUrl}}/v1/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "id": "",
                "email": "",
                "name": ""
              },
              "workspace": {
                "id": "",
                "name": ""
              },
              "credential": {
                "type": "oauth",
                "id": "",
                "name": ""
              }
            }
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns the user, workspace, and credential represented by the current token.

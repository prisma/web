info:
  name: Get Prisma Accelerate regions
  type: http
  seq: 3
  tags:
    - Misc

http:
  method: GET
  url: "{{baseUrl}}/v1/regions/accelerate"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returns all available regions for Prisma Accelerate.
    request:
      url: "{{baseUrl}}/v1/regions/accelerate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "type": "",
                "name": ""
              }
            ]
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/regions/accelerate"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns all available regions for Prisma Accelerate.

info:
  name: Transfer project
  type: http
  seq: 6
  tags:
    - Projects

http:
  method: POST
  url: "{{baseUrl}}/v1/projects/:id/transfer"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "recipientAccessToken": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


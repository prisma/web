info:
  name: Update project
  type: http
  seq: 5
  tags:
    - Projects

http:
  method: PATCH
  url: "{{baseUrl}}/v1/projects/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "settings": {}
      }
  auth: inherit

settings:

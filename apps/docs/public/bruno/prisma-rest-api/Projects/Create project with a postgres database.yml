info:
  name: Create project with a postgres database
  type: http
  seq: 2
  tags:
    - Projects

http:
  method: POST
  url: "{{baseUrl}}/v1/projects"
  body:
    type: json
    data: |-
      {
        "createDatabase": false,
        "name": "",
        "region": "us-east-1",
        "logicalId": "",
        "workspaceId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


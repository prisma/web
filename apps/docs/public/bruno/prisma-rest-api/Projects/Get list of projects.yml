info:
  name: Get list of projects
  type: http
  seq: 1
  tags:
    - Projects

http:
  method: GET
  url: "{{baseUrl}}/v1/projects"
  params:
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Limit for pagination
    - name: logicalId
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


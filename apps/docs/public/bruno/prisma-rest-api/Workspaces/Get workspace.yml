info:
  name: Get workspace
  type: http
  seq: 2
  tags:
    - Workspaces

http:
  method: GET
  url: "{{baseUrl}}/v1/workspaces/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Workspace retrieved.
    request:
      url: "{{baseUrl}}/v1/workspaces/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "type": "",
              "url": "",
              "name": "",
              "createdAt": ""
            }
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/workspaces/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/workspaces/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }
  - name: 404 Response
    description: Workspace with the specified ID was not found.
    request:
      url: "{{baseUrl}}/v1/workspaces/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns the workspace with the given ID.

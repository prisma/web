    description: Returned list of connections.
    request:
      url: "{{baseUrl}}/v1/connections"
      method: GET
      params:
        - name: cursor
          value: ""
          type: query
          description: Cursor for pagination
          disabled: true
        - name: limit
          value: "100"
          type: query
          description: Limit for pagination
        - name: databaseId
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "type": "",
                "url": "",
                "name": "",
                "createdAt": "",

info:
  name: List connections
  type: http
  seq: 1
  tags:
    - Connections

http:
  method: GET
  url: "{{baseUrl}}/v1/connections"
  params:
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Limit for pagination
    - name: databaseId
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:

info:
  name: Delete connection
  type: http
  seq: 4
  tags:
    - Connections

http:
  method: DELETE
  url: "{{baseUrl}}/v1/connections/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: Deleted the connection.
    request:
      url: "{{baseUrl}}/v1/connections/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/connections/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/connections/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0

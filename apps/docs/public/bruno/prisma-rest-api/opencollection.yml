opencollection: 1.0.0

info:
  name: Prisma REST API
  version: "1"

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://auth.prisma.io/authorize
    accessTokenUrl: https://auth.prisma.io/token
    refreshTokenUrl: https://auth.prisma.io/token
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: workspace:admin offline_access
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

docs:
  content: REST API for managing Prisma Postgres projects, databases, backups, and workspaces.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

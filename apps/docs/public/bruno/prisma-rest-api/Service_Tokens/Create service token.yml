info:
  name: Create service token
  type: http
  seq: 2
  tags:
    - Service_Tokens

http:
  method: POST
  url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
  params:
    - name: workspaceId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "projectId": "",
        "expiresAt": "",
        "name": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created a new service token. The token value is returned once in the response body.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
      method: POST
      params:
        - name: workspaceId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "projectId": "",
            "expiresAt": "",
            "name": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "type": "",
              "name": "",
              "scope": "workspace",
              "projectId": "",
              "valueHint": "",
              "createdAt": "",
              "expiresAt": "",
              "value": ""

info:
  name: List service tokens
  type: http
  seq: 1
  tags:
    - Service_Tokens

http:
  method: GET
  url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
  params:
    - name: workspaceId
      value: ""
      type: path
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Page size, 1-100
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returns the list of service tokens. Empty when the workspace does not exist or the caller is not a member of it.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
      method: GET
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: cursor
          value: ""
          type: query
          description: Cursor for pagination
          disabled: true
        - name: limit
          value: "100"
          type: query
          description: Page size, 1-100
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "type": "",
                "name": "",
                "scope": "workspace",
                "projectId": "",
                "valueHint": "",
                "createdAt": "",
                "expiresAt": ""
              }
            ],
            "pagination": {
              "nextCursor": "",
              "hasMore": false
            }
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
      method: GET
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: cursor
          value: ""
          type: query
          description: Cursor for pagination
          disabled: true
        - name: limit
          value: "100"
          type: query
          description: Page size, 1-100
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens"
      method: GET
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: cursor
          value: ""
          type: query
          description: Cursor for pagination
          disabled: true
        - name: limit
          value: "100"
          type: query
          description: Page size, 1-100
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns the service tokens for the given workspace, newest first.

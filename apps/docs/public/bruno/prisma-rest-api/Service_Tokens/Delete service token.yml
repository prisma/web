info:
  name: Delete service token
  type: http
  seq: 3
  tags:
    - Service_Tokens

http:
  method: DELETE
  url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens/:serviceTokenId"
  params:
    - name: workspaceId
      value: ""
      type: path
    - name: serviceTokenId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: Deleted the service token successfully.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens/:serviceTokenId"
      method: DELETE
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: serviceTokenId
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens/:serviceTokenId"
      method: DELETE
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: serviceTokenId
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens/:serviceTokenId"
      method: DELETE
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: serviceTokenId
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }
  - name: 404 Response
    description: Workspace not found, or the service token does not exist in it.
    request:
      url: "{{baseUrl}}/v1/workspaces/:workspaceId/service-tokens/:serviceTokenId"
      method: DELETE
      params:
        - name: workspaceId
          value: ""
          type: path
        - name: serviceTokenId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Revokes the service token with the given ID by deleting it.

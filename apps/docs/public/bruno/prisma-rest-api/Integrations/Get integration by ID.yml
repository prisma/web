info:
  name: Get integration by ID
  type: http
  seq: 2
  tags:
    - Integrations

http:
  method: GET
  url: "{{baseUrl}}/v1/integrations/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Returned the integration.
    request:
      url: "{{baseUrl}}/v1/integrations/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "url": "",
              "createdAt": "",
              "scopes": [],
              "client": {
                "id": "",
                "name": "",
                "createdAt": ""
              },
              "createdByUser": {
                "id": "",
                "email": "",
                "displayName": ""
              }
            }
          }
  - name: 400 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/v1/integrations/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "error": [],
            "data": ""
          }
  - name: 401 Response
    description: Missing or invalid authorization token.
    request:
      url: "{{baseUrl}}/v1/integrations/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }
  - name: 404 Response
    description: Integration with the given ID was not found.
    request:
      url: "{{baseUrl}}/v1/integrations/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "hint": "",
              "verification": {
                "type": "",
                "name": "",
                "value": "",
                "ttl": 0
              }
            }
          }

docs: Returns a single integration by its ID.

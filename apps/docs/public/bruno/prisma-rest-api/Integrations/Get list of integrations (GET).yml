info:
  name: Get list of integrations (GET)
  type: http
  seq: 4
  tags:
    - Integrations

http:
  method: GET
  url: "{{baseUrl}}/v1/workspaces/:workspaceId/integrations"
  params:
    - name: workspaceId
      value: ""
      type: path
    - name: cursor
      value: ""
      type: query
      description: Cursor for pagination
      disabled: true
    - name: limit
      value: "100"
      type: query
      description: Limit for pagination
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


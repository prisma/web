info:
  name: Create database connection string
  type: http
  seq: 2
  tags:
    - Databases_Connections

http:
  method: POST
  url: "{{baseUrl}}/v1/databases/:databaseId/connections"
  params:
    - name: databaseId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


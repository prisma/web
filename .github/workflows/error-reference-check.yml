name: Error Reference Check

# The published error-reference pages must list every structured error code
# the released products can emit — prisma/orm errors link to
# /docs/orm/reference/error-reference#<CODE>, prisma/prisma-cli errors to
# /docs/cli/error-reference#<CODE>. Each repo is checked out at the tag of its
# `latest` npm release, the same ref the sync workflow generates from, so
# codes that exist only on main do not fail the check. This check fails if any
# released code is missing from its page, even if the sync workflow breaks.
#
# Runs on pushes to main, on PRs that touch the page or its tooling, and on a
# daily schedule so drift introduced upstream is flagged without blocking
# unrelated PRs.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/docs/content/docs/orm/reference/error-reference.mdx
      - apps/docs/content/docs/cli/error-reference.mdx
      - apps/docs/scripts/generate-error-reference.mjs
      - .github/workflows/error-reference-check.yml
      - .github/workflows/sync-error-reference-docs.yml
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify error-reference completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve the released versions
        id: release
        working-directory: apps/docs
        run: |
          echo "orm=$(node ./scripts/generate-error-reference.mjs --target orm --print-ref)" >> "$GITHUB_OUTPUT"
          echo "cli=$(node ./scripts/generate-error-reference.mjs --target cli --print-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout prisma/orm (latest release)
        uses: actions/checkout@v4
        with:
          repository: prisma/orm
          ref: ${{ steps.release.outputs.orm }}
          path: prisma-src
          persist-credentials: false

      - name: Checkout prisma/prisma-cli (latest release)
        uses: actions/checkout@v4
        with:
          repository: prisma/prisma-cli
          ref: ${{ steps.release.outputs.cli }}
          path: prisma-cli-src
          persist-credentials: false

      - name: Verify ORM page lists every known error code
        run: node prisma-src/scripts/list-error-codes.mjs --root prisma-src --verify apps/docs/content/docs/orm/reference/error-reference.mdx

      - name: Verify CLI page lists every known error code
        run: node prisma-cli-src/scripts/list-error-codes.mjs --root prisma-cli-src --verify apps/docs/content/docs/cli/error-reference.mdx
